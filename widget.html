<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On This Day widget · homepage preview</title>
    <style>
      /* A neutral stand-in for a homepage, just to show the widget in context. */
      html { font-size: 10px; } /* archive.org's root size; the tiles rely on it */
      /* Colours sampled from the live archive.org homepage. */
      body {
        margin: 0; font: 16px/1.5 'Helvetica Neue', Helvetica, Arial, sans-serif;
        color: #2c2c2c; background: #fbfbfd;
      }
      .note {
        background: #fff4d6; border-bottom: 1px solid #ecd9a6;
        padding: 8px 16px; font-size: 14px; text-align: center;
      }
      .note a { color: #0b6e99; }
      header.mock { background: #2c2c2c; color: #eee; padding: 14px 16px; font-weight: 700; }
      .band {
        background: #666; color: #fff; text-align: center; padding: 28px 16px;
      }
      .band .placeholder { border-color: rgb(255 255 255 / .5); color: #eee; max-width: 600px; margin: 0 auto; height: 60px; }
      main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
      .placeholder {
        border: 2px dashed #ccc; border-radius: 12px; color: #888;
        display: grid; place-items: center; text-align: center; padding: 16px;
      }
      .hero { height: 160px; margin-bottom: 32px; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 32px; }
      .row .placeholder { height: 120px; }
    </style>
    <script type="module" src="/src/widget.ts"></script>
  </head>
  <body>
    <p class="note">
      Homepage preview: the dashed boxes stand in for existing homepage content.
      <a href="./">Open the full timeline</a>
    </p>
    <header class="mock">Site header</header>
    <div class="band"><div class="placeholder">Search band</div></div>
    <main>
      <div class="placeholder hero">Homepage intro / news</div>
      <ia-on-this-day full-page-url="./"></ia-on-this-day>
      <div class="row">
        <div class="placeholder">Existing homepage section</div>
        <div class="placeholder">Existing homepage section</div>
        <div class="placeholder">Existing homepage section</div>
      </div>
    </main>
  </body>
</html>
